<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroMillions Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
        }
        img {
            width: 100%;
            max-width: 300px;
        }
        h1 {
            color: #1e88e5;
        }
        ul {
            list-style-type: none;
            padding: 0;
            font-weight: bold;
        }
        li {
            background: #fff;
            margin: 10px auto;
            padding: 15px;
            width: 80%;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        button, input[type="submit"] {
            background-color: #1e88e5;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #1565c0;
        }
        #chartContainer {
            width: 80%;
            margin: 20px auto;
        }
        #lastDraw, #highProbability, #lowProbability, #luckyPick {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Bunsoys EuroMillions Matrix</h1>
    <h3>Last Winning Numbers</h3>
    <ul id="lastDraw"></ul>

    <h2>Analysis</h2>
    <div>
        <h3>Key Insights</h3>
        <p id="frequentNumbers"></p>
        <p id="numberPatterns"></p>
        <p id="luckyStars"></p>
        <p id="sequentialNumbers"></p>
        <p id="outliers"></p>
    </div>

    <h2>Statistical Analysis</h2>
    <div>
        <p id="meanMedian"></p>
        <p id="standardDeviation"></p>
        <p id="distribution"></p>
    </div>

    <div id="chartContainer">
        <canvas id="numberChart"></canvas>
        <canvas id="starChart" style="margin-top: 20px;"></canvas>
    </div>

    <h5>"The odds of being struck by lightning in your lifetime are 1 in 3,000" - pero kung dili motaya, dili makadaog</h5>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
